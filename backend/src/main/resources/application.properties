spring.application.name=backend
spring.config.import=optional:file:.env.properties

# The Flutter client targets :8081 (8080 was occupied locally). Pin it here so
# the app no longer depends on passing --server.port=8081 at every launch.
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:muklog}
spring.datasource.username=${DB_USERNAME:muklog}
spring.datasource.password=${DB_PASSWORD:muklog}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.jwt.secret=${JWT_SECRET:dev-only-change-me-please-use-a-long-random-string-32bytes-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}
