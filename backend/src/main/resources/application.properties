spring.application.name=backend
spring.config.import=optional:file:.env.properties

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nomlog}
spring.datasource.username=${DB_USERNAME:nomlog}
spring.datasource.password=${DB_PASSWORD:nomlog}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.jwt.secret=${JWT_SECRET:dev-only-change-me-please-use-a-long-random-string-32bytes-min}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}
